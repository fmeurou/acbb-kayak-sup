{% extends "base.html" %}
{% block title %}Tags - {{ SITENAME }}{% endblock %}
{% block content %}
<header class="page-header">
	<h1>Tags</h1>
</header>
<section>
	<ul>
		{% for tag, null in tags %}
		<li><a href="{{ SITEURL }}/{{ tag.url }}">{{ tag }}</a></li>
		{% endfor %}
	</ul>
</section>
{% endblock %}
