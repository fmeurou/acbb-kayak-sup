{% extends "base.html" %}

{% block title %}{{ page.title|striptags }} - {{ SITENAME }}{% endblock %}

{% block hero %}
<div class="hero" style="height:320px;background-image:url('{{ page.image if page.image else SITEURL + '/theme/images/hero-default-bg.jpg' }}');"></div>
{% endblock %}

{% block content %}
<header class="page-header">
	<h1>{{ page.title }}</h1>
</header>
{{ page.content }}
{% endblock %}
