{% if articles_page and articles_page.has_other_pages() %}
<div class="pagination">
	{% if articles_page.has_previous() %}
	<a href="{{ SITEURL }}/{{ articles_previous_page.url }}">&laquo; Précédent</a>
	{% endif %}
	<span class="pagination_current">Page {{ articles_page.number }} / {{ articles_page.paginator.num_pages }}</span>
	{% if articles_page.has_next() %}
	<a href="{{ SITEURL }}/{{ articles_next_page.url }}">Suivant &raquo;</a>
	{% endif %}
</div>
{% endif %}
