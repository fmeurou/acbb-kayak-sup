{% extends "base.html" %}
{% block title %}Catégories - {{ SITENAME }}{% endblock %}
{% block content %}
<header class="page-header">
	<h1>Catégories</h1>
</header>
<section>
	<ul>
		{% for category, null in categories %}
		<li><a href="{{ SITEURL }}/{{ category.url }}">{{ category }}</a></li>
		{% endfor %}
	</ul>
</section>
{% endblock %}
